name: Run Tests

on:
  pull_request:
    branches: main 
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ hashFiles('.devcontainer/Dockerfile', '.devcontainer/requirements.students.txt') }}
        restore-keys: |
          ${{ runner.os }}-buildx-
    
    - name: Build test Docker image
      uses: docker/build-push-action@v5
      with:
        context: .devcontainer/
        file: .devcontainer/Dockerfile
        tags: mavis-test:latest
        load: true
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
    
    # Fix cache growing indefinitely
    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
    
    - name: Run tests in container
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/workspaces/mavis_client \
          -w /workspaces/mavis_client \
          mavis-test:latest \
          bash -c "pytest test/ -v -s"
